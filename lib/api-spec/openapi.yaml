openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Jeu des valeurs — API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: catalogue
    description: Catalogue de cartes et dilemmes
  - name: sessions
    description: Sessions de jeu
  - name: cartes
    description: Cartes sélectionnées dans une session
  - name: reponses
    description: Réponses aux collisions
  - name: constellation
    description: Constellation personnelle

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  # ─── Catalogue ───────────────────────────────────────────────────────────────

  /catalogue/cartes:
    get:
      operationId: listCartessCatalogue
      tags: [catalogue]
      summary: Liste toutes les cartes du catalogue (filtrable par famille)
      parameters:
        - in: query
          name: famille
          required: false
          schema:
            type: string
            enum: [lignes_rouges, horizons, tresors]
      responses:
        "200":
          description: Liste de cartes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CarteCatalogue"

  /catalogue/valeurs:
    get:
      operationId: listValeursCatalogue
      tags: [catalogue]
      summary: Liste les valeurs de référence et leur description
      responses:
        "200":
          description: Liste de valeurs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ValeurCatalogue"

  # ─── Sessions ────────────────────────────────────────────────────────────────

  /sessions:
    post:
      operationId: createSession
      tags: [sessions]
      summary: Crée une nouvelle session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SessionInput"
      responses:
        "201":
          description: Session créée
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"

  /sessions/{sessionId}:
    get:
      operationId: getSession
      tags: [sessions]
      summary: Récupère une session complète
      parameters:
        - $ref: "#/components/parameters/SessionId"
      responses:
        "200":
          description: Session trouvée
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "404":
          description: Session introuvable
    patch:
      operationId: updateSession
      tags: [sessions]
      summary: Met à jour l'étape courante d'une session
      parameters:
        - $ref: "#/components/parameters/SessionId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SessionUpdate"
      responses:
        "200":
          description: Session mise à jour
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "404":
          description: Session introuvable
    delete:
      operationId: deleteSession
      tags: [sessions]
      summary: Supprime toutes les données d'une session
      parameters:
        - $ref: "#/components/parameters/SessionId"
      responses:
        "204":
          description: Session supprimée
        "404":
          description: Session introuvable

  # ─── Cartes session ──────────────────────────────────────────────────────────

  /sessions/{sessionId}/cartes-proposees:
    get:
      operationId: listCartesProposees
      tags: [cartes]
      summary: La main de cartes tirée pour cette partie
      description: >
        900 cartes ne se parcourent pas à l'écran. Chaque partie reçoit une main
        tirée avec sa graine : stable pour une partie donnée, différente d'une
        partie à l'autre. `parFamille` élargit la main sans la rebattre — les
        cartes déjà vues restent en place, d'autres s'ajoutent après elles.
      parameters:
        - $ref: "#/components/parameters/SessionId"
        - in: query
          name: parFamille
          required: false
          schema:
            type: number
          description: Combien de cartes par famille (18 par défaut, 54 au plus)
      responses:
        "200":
          description: Cartes proposées
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CarteCatalogue"
        "404":
          description: Session introuvable

  /sessions/{sessionId}/cartes:
    get:
      operationId: listCartesSession
      tags: [cartes]
      summary: Liste les cartes sélectionnées pour une session
      parameters:
        - $ref: "#/components/parameters/SessionId"
      responses:
        "200":
          description: Cartes de la session
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CarteSession"
    post:
      operationId: addCarteSession
      tags: [cartes]
      summary: Ajoute une carte (du catalogue ou personnalisée)
      parameters:
        - $ref: "#/components/parameters/SessionId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CarteSessionInput"
      responses:
        "201":
          description: Carte ajoutée
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CarteSession"
        "400":
          description: Données invalides

  /sessions/{sessionId}/cartes/{carteSessionId}:
    patch:
      operationId: updateCarteSession
      tags: [cartes]
      summary: Modifie une carte (libellé, description, valeurs confirmées)
      parameters:
        - $ref: "#/components/parameters/SessionId"
        - $ref: "#/components/parameters/CarteSessionId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CarteSessionUpdate"
      responses:
        "200":
          description: Carte mise à jour
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CarteSession"
        "404":
          description: Carte introuvable
    delete:
      operationId: removeCarteSession
      tags: [cartes]
      summary: Retire une carte de la session
      parameters:
        - $ref: "#/components/parameters/SessionId"
        - $ref: "#/components/parameters/CarteSessionId"
      responses:
        "204":
          description: Carte retirée
        "404":
          description: Carte introuvable

  # ─── Réponses (collisions) ────────────────────────────────────────────────────

  /sessions/{sessionId}/reponses:
    get:
      operationId: listReponses
      tags: [reponses]
      summary: Liste toutes les réponses aux collisions d'une session
      parameters:
        - $ref: "#/components/parameters/SessionId"
      responses:
        "200":
          description: Réponses enregistrées
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ReponseCollision"
    post:
      operationId: createReponse
      tags: [reponses]
      summary: Enregistre une réponse à une collision
      parameters:
        - $ref: "#/components/parameters/SessionId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReponseCollisionInput"
      responses:
        "201":
          description: Réponse enregistrée
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReponseCollision"
        "400":
          description: Données invalides

  /sessions/{sessionId}/reponses/{reponseId}:
    patch:
      operationId: updateReponse
      tags: [reponses]
      summary: Corrige une réponse (sans écrasement silencieux — crée une nouvelle version)
      parameters:
        - $ref: "#/components/parameters/SessionId"
        - $ref: "#/components/parameters/ReponseId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReponseCollisionUpdate"
      responses:
        "200":
          description: Réponse mise à jour
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReponseCollision"
        "404":
          description: Réponse introuvable

  # ─── Constellation ────────────────────────────────────────────────────────────

  /sessions/{sessionId}/constellation:
    get:
      operationId: getConstellation
      tags: [constellation]
      summary: Calcule et retourne la constellation personnelle (déterministe)
      parameters:
        - $ref: "#/components/parameters/SessionId"
      responses:
        "200":
          description: Constellation calculée
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Constellation"
        "404":
          description: Session introuvable

  /sessions/{sessionId}/progres:
    get:
      operationId: getProgres
      tags: [sessions]
      summary: Retourne un résumé de la progression de la session
      parameters:
        - $ref: "#/components/parameters/SessionId"
      responses:
        "200":
          description: Progression
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Progres"

components:
  parameters:
    SessionId:
      in: path
      name: sessionId
      required: true
      schema:
        type: string
    CarteSessionId:
      in: path
      name: carteSessionId
      required: true
      schema:
        type: number
    ReponseId:
      in: path
      name: reponseId
      required: true
      schema:
        type: number

  schemas:
    HealthStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string

    # ─── Catalogue ─────────────────────────────────────────────────────────────

    CarteCatalogue:
      type: object
      required: [id, famille, label, valeursSuggérées, origine]
      properties:
        id:
          type: string
          description: "Identifiant stable du contenu (ex. JV1001, LR042)"
        famille:
          type: string
          enum: [lignes_rouges, horizons, tresors]
        label:
          type: string
        description:
          type: ["string", "null"]
        valeursSuggérées:
          type: array
          items:
            type: string
        origine:
          type: string
          enum: [maison, relue, importee]
          description: >
            `maison` : carte écrite ici. `relue` : carte du jeu de 825, relue
            pour le registre, dont les valeurs suggérées viennent de sa
            catégorie. `importee` : pas encore relue.
        categorie:
          type: ["string", "null"]
        estPersonnalisable:
          type: boolean

    ValeurCatalogue:
      type: object
      required: [label, description, famille, familleValeur]
      properties:
        label:
          type: string
          description: Libellé canonique — sert d'identifiant partout
        description:
          type: string
        famille:
          type: string
          enum: [ouverture, attention_aux_autres, continuite, affirmation]
          description: Grande famille théorique (cadre de haut niveau)
        familleValeur:
          type: string
          description: >
            Famille de valeurs — l'étage qui décide de l'admissibilité d'un
            duel (autonomie, bienveillance, justice, securite…)
        quasiSynonymes:
          type: array
          items:
            type: string
          description: Valeurs trop proches pour être confrontées à celle-ci

    Question:
      type: object
      description: >
        Une comparaison à trancher. `optionA` protège `valeurA`, `optionB`
        protège `valeurB`. Un duel oppose deux valeurs — soit à travers deux
        cartes de la personne, soit à travers une situation écrite ; une bascule
        reprend la même tension en ne faisant bouger qu'une seule dimension d'un
        palier à l'autre.
      required:
        [
          type,
          dilemmeId,
          valeurA,
          valeurB,
          situation,
          optionA,
          optionB,
          estVariante,
          phase,
          approfondir,
        ]
      properties:
        type:
          type: string
          enum: [duel, bascule]
        dilemmeId:
          type: number
        valeurA:
          type: string
        valeurB:
          type: string
        situation:
          type: string
        optionA:
          type: string
        optionB:
          type: string
        contexte:
          type: ["string", "null"]
          description: "Situation écrite : amis, ecole, maison, en_ligne, equipe, public"
        estVariante:
          type: boolean
          description: Vrai si cette tension a déjà été vue sous une autre forme
        carteA:
          type: ["string", "null"]
          description: Carte de session qui manifeste `valeurA`, si la question vient des cartes
        carteB:
          type: ["string", "null"]
        carteALabel:
          type: ["string", "null"]
        carteBLabel:
          type: ["string", "null"]
        phase:
          type: string
          enum: [ordination, epreuve]
          description: Phase à enregistrer avec la réponse
        motif:
          type: ["string", "null"]
          description: >
            Mise à l'épreuve : pourquoi cette tension maintenant —
            reponses_variables, forces_proches, ca_depend_frequent,
            paire_jamais_vue, jamais_secondaire, domine_presque_tout
        motifTexte:
          type: ["string", "null"]
          description: Le motif, en une phrase affichable
        approfondir:
          type: boolean
          description: >
            Vrai quand le jeu a le droit de poser ses questions de relance
            (difficulté, valeur protégée, ce qui aurait pu changer la réponse).
            Toujours faux pendant la première passe.
        serieId:
          type: ["string", "null"]
        palier:
          type: ["number", "null"]
        dimension:
          type: ["string", "null"]
          description: >
            Bascule : la seule dimension qui bouge — ampleur_impact,
            proximite_sociale, certitude, cout_personnel, urgence,
            nombre_personnes, reversibilite
        reglage:
          type: ["string", "null"]
          description: "Bascule : le cran atteint à ce palier"
        amorce:
          type: ["string", "null"]
          description: "Bascule : le décor, identique à tous les paliers de la série"

    # ─── Session ───────────────────────────────────────────────────────────────

    Session:
      type: object
      required: [id, etapeCourante, creeLe, miseAJourLe]
      properties:
        id:
          type: string
        etapeCourante:
          type: string
          enum:
            [
              accueil,
              selection_cartes,
              confirmation_valeurs,
              ordination,
              constellation,
              epreuve,
            ]
        creeLe:
          type: string
          format: date-time
        miseAJourLe:
          type: string
          format: date-time

    SessionInput:
      type: object
      properties:
        etapeCourante:
          type: string
          enum:
            [
              accueil,
              selection_cartes,
              confirmation_valeurs,
              ordination,
              constellation,
              epreuve,
            ]
          default: accueil

    SessionUpdate:
      type: object
      properties:
        etapeCourante:
          type: string
          enum:
            [
              accueil,
              selection_cartes,
              confirmation_valeurs,
              ordination,
              constellation,
              epreuve,
            ]

    # ─── Cartes session ────────────────────────────────────────────────────────

    CarteSession:
      type: object
      required: [id, sessionId, famille, label, valeursConfirmées, estPersonnalisée]
      properties:
        id:
          type: number
        sessionId:
          type: string
        catalogueCarteId:
          type: ["string", "null"]
        famille:
          type: string
          enum: [lignes_rouges, horizons, tresors]
        label:
          type: string
        description:
          type: ["string", "null"]
        valeursConfirmées:
          type: array
          items:
            type: string
        valeursSuggérées:
          type: array
          items:
            type: string
        estPersonnalisée:
          type: boolean
        creeLe:
          type: string
          format: date-time

    CarteSessionInput:
      type: object
      required: [famille, label]
      properties:
        catalogueCarteId:
          type: ["string", "null"]
        famille:
          type: string
          enum: [lignes_rouges, horizons, tresors]
        label:
          type: string
        description:
          type: ["string", "null"]
        valeursSuggérées:
          type: array
          items:
            type: string
        valeursConfirmées:
          type: array
          items:
            type: string
        estPersonnalisée:
          type: boolean

    CarteSessionUpdate:
      type: object
      properties:
        label:
          type: string
        description:
          type: ["string", "null"]
        valeursConfirmées:
          type: array
          items:
            type: string

    # ─── Réponses ──────────────────────────────────────────────────────────────

    ReponseCollision:
      type: object
      required: [id, sessionId, valeurA, valeurB, choix, phase, version, creeLe]
      properties:
        id:
          type: number
        sessionId:
          type: string
        dilemmeId:
          type: ["number", "null"]
        valeurA:
          type: string
        valeurB:
          type: string
        carteA:
          type: ["string", "null"]
          description: Carte de session qui manifestait `valeurA`
        carteB:
          type: ["string", "null"]
        choix:
          type: string
          enum: [A, B, ca_depend, je_ne_sais_pas, passer]
        contexte:
          type: ["string", "null"]
          description: Où ça se passait, quand la situation le précisait
        phase:
          type: string
          enum: [ordination, epreuve]
        facteurDepend:
          type: ["string", "null"]
          description: >
            Facteur prédéfini si choix=ca_depend : cout_personnel, ampleur_impact,
            proximite_sociale, nombre_personnes, certitude, reversibilite,
            urgence, responsabilite
        facteurDependLibre:
          type: ["string", "null"]
          description: Réponse libre si facteurDepend = autre
        difficulte:
          type: ["number", "null"]
          description: 1 à 5. Demandé seulement en phase de mise à l'épreuve.
        certitude:
          type: ["number", "null"]
          description: 1 à 5. Demandé seulement en phase de mise à l'épreuve.
        serieId:
          type: ["string", "null"]
          description: Série de bascule, si la réponse en fait partie
        palier:
          type: ["number", "null"]
        dimension:
          type: ["string", "null"]
        valeurProtegee:
          type: ["string", "null"]
          description: Valeur que la personne dit avoir voulu protéger (jamais déduite)
        ceQuiChangerait:
          type: ["string", "null"]
          description: Ce qui aurait pu faire changer sa réponse, dans ses mots
        version:
          type: number
          description: Numéro de version (incrémenter à chaque correction)
        creeLe:
          type: string
          format: date-time
        miseAJourLe:
          type: string
          format: date-time

    ReponseCollisionInput:
      type: object
      required: [valeurA, valeurB, choix]
      properties:
        dilemmeId:
          type: ["number", "null"]
        valeurA:
          type: string
        valeurB:
          type: string
        carteA:
          type: ["string", "null"]
        carteB:
          type: ["string", "null"]
        choix:
          type: string
          enum: [A, B, ca_depend, je_ne_sais_pas, passer]
        contexte:
          type: ["string", "null"]
        phase:
          type: ["string", "null"]
          description: ordination (défaut) ou epreuve
        facteurDepend:
          type: ["string", "null"]
        facteurDependLibre:
          type: ["string", "null"]
        difficulte:
          type: ["number", "null"]
        certitude:
          type: ["number", "null"]
        serieId:
          type: ["string", "null"]
        palier:
          type: ["number", "null"]
        dimension:
          type: ["string", "null"]
        valeurProtegee:
          type: ["string", "null"]
        ceQuiChangerait:
          type: ["string", "null"]

    ReponseCollisionUpdate:
      type: object
      properties:
        choix:
          type: string
          enum: [A, B, ca_depend, je_ne_sais_pas, passer]
        facteurDepend:
          type: ["string", "null"]
        facteurDependLibre:
          type: ["string", "null"]
        difficulte:
          type: ["number", "null"]
        certitude:
          type: ["number", "null"]
        valeurProtegee:
          type: ["string", "null"]
        ceQuiChangerait:
          type: ["string", "null"]

    # ─── Constellation ─────────────────────────────────────────────────────────

    TendanceValeur:
      type: object
      required:
        [
          valeur,
          scoreNet,
          totalCollisions,
          foisPrivilegiee,
          foisCedee,
          incertitudes,
          abandonnes,
          difficulteMoyenne,
          certitudeMoyenne,
          territoireInexplore,
          estProtegee,
          domine,
          cedeDevant,
          contextesFavorables,
        ]
      properties:
        valeur:
          type: string
        scoreNet:
          type: number
          description: Score net (victoires - défaites) / total significatifs
        totalCollisions:
          type: number
        foisPrivilegiee:
          type: number
          description: Fois où cette valeur est passée devant l'autre
        foisCedee:
          type: number
          description: Fois où cette valeur a cédé la place
        incertitudes:
          type: number
          description: ca_depend + je_ne_sais_pas
        abandonnes:
          type: number
          description: passer
        difficulteMoyenne:
          type: ["number", "null"]
        certitudeMoyenne:
          type: ["number", "null"]
        territoireInexplore:
          type: boolean
          description: Vrai si aucune collision résolue pour cette valeur
        estProtegee:
          type: boolean
          description: >
            Vrai si aucun compromis n'a encore été observé — la valeur a été
            privilégiée à chaque fois qu'elle a été mise à l'épreuve. Ce n'est
            pas un classement : c'est l'absence d'exception connue à ce jour.
        domine:
          type: array
          items:
            type: string
          description: Valeurs devant lesquelles celle-ci est passée
        cedeDevant:
          type: array
          items:
            type: string
          description: Valeurs devant lesquelles celle-ci a cédé
        contextesFavorables:
          type: array
          items:
            type: string
          description: Contextes où cette valeur est passée devant

    TensionObservee:
      type: object
      required: [valeurA, valeurB, totalCollisions, incertitudes, estForte, estStable]
      properties:
        valeurA:
          type: string
        valeurB:
          type: string
        totalCollisions:
          type: number
        incertitudes:
          type: number
        estForte:
          type: boolean
          description: La personne a rarement tranché cette tension
        estStable:
          type: ["boolean", "null"]
          description: >
            Null si la tension n'a été rencontrée qu'une fois. Sinon, vrai si la
            même tension a reçu la même réponse sous ses différentes formes.

    PointDeBascule:
      type: object
      required: [serieId, valeurA, valeurB, dimension, choixInitial, paliers, reglageBascule]
      properties:
        serieId:
          type: string
        valeurA:
          type: string
        valeurB:
          type: string
        dimension:
          type: string
        choixInitial:
          type: string
          enum: [A, B]
          description: Réponse au premier palier
        paliers:
          type: number
          description: Nombre de paliers joués dans la série
        reglageBascule:
          type: ["string", "null"]
          description: >
            Le cran où la réponse a changé. Null si elle n'a pas changé sur
            l'étendue jouée — le point de bascule est alors hors de portée du jeu.

    ObservationConstellation:
      type: object
      required: [id, texte, type, valeursConcernees, reponsesSources]
      properties:
        id:
          type: string
        texte:
          type: string
          description: >
            Formulation prudente et bornée à ce qui a été joué. Emploie partout
            la terminologie symétrique « a été prioritaire sur » / « a été
            secondaire face à ».
        type:
          type: string
          enum:
            [
              ordination,
              valeur_forte,
              valeur_contextuelle,
              valeur_protegee,
              tension,
              stabilite,
              point_de_bascule,
              cycle,
              territoire_inexplore,
              couverture,
              confiance,
            ]
        valeursConcernees:
          type: array
          items:
            type: string
        reponsesSources:
          type: array
          items:
            type: number
          description: IDs dans `reponses_collision` qui appuient cette observation

    LigneOrdination:
      type: object
      description: >
        La place estimée d'une valeur, selon un modèle de comparaison par paires
        (Bradley-Terry). Ce n'est pas un palmarès : c'est une estimation
        évolutive, avec son incertitude.
      required:
        [
          valeur,
          rang,
          force,
          incertitude,
          intervalleBas,
          intervalleHaut,
          niveauConfiance,
          comparaisons,
          foisPrioritaire,
          foisSecondaire,
          indecis,
          jamaisSecondaire,
          prioritaireSur,
          secondaireFaceA,
          contextes,
        ]
      properties:
        valeur:
          type: string
        rang:
          type: number
          description: À partir de 1. Deux forces indiscernables partagent leur rang.
        force:
          type: number
          description: Force relative en échelle logarithmique, centrée sur 0
        incertitude:
          type: number
          description: Erreur type sur la force. Grande ⇒ on ne sait pas encore.
        intervalleBas:
          type: number
        intervalleHaut:
          type: number
        niveauConfiance:
          type: string
          enum:
            [
              tendance_forte,
              tendance_probable,
              encore_incertain,
              territoire_peu_explore,
            ]
        comparaisons:
          type: number
        foisPrioritaire:
          type: number
        foisSecondaire:
          type: number
        indecis:
          type: number
          description: ca_depend + je_ne_sais_pas
        jamaisSecondaire:
          type: boolean
          description: >
            Vrai tant qu'aucune comparaison tranchée ne l'a fait passer derrière.
            Ce n'est pas un classement : c'est l'absence d'exception connue.
        prioritaireSur:
          type: array
          items:
            type: string
        secondaireFaceA:
          type: array
          items:
            type: string
        contextes:
          type: array
          items:
            type: string
          description: Contextes où cette valeur a été prioritaire

    RelationValeurs:
      type: object
      required:
        [
          valeurA,
          valeurB,
          prioritaire,
          probabilite,
          comparaisons,
          manifestations,
          indecis,
          variable,
        ]
      properties:
        valeurA:
          type: string
        valeurB:
          type: string
        prioritaire:
          type: ["string", "null"]
          description: Valeur passée devant le plus souvent, null si rien ne se détache
        probabilite:
          type: number
          description: P(valeurA prioritaire sur valeurB) selon le modèle ajusté
        comparaisons:
          type: number
        manifestations:
          type: number
          description: Combien de formes différentes ont servi cette même tension
        indecis:
          type: number
        variable:
          type: boolean
          description: >
            Vrai si la réponse a changé d'une manifestation à l'autre. Ce n'est
            jamais une contradiction : le contexte a compté.

    ValeurContextuelle:
      type: object
      required: [valeur, contextes, texte]
      properties:
        valeur:
          type: string
        contextes:
          type: array
          items:
            type: string
        texte:
          type: string

    TensionPrincipale:
      type: object
      required: [valeurA, valeurB, type, texte]
      properties:
        valeurA:
          type: string
        valeurB:
          type: string
        type:
          type: string
          enum: [renversement, indecise, serree, tranchee]
        texte:
          type: string
          description: Ce que la tension a montré, en une phrase

    DimensionSensible:
      type: object
      description: >
        Un réglage qui semble déplacer les décisions : proximité, coût
        personnel, gravité, certitude, urgence, réversibilité, nombre de
        personnes touchées.
      required: [dimension, libelle, occurrences, source]
      properties:
        dimension:
          type: string
        libelle:
          type: string
        occurrences:
          type: number
        source:
          type: string
          enum: [ca_depend, bascule]
          description: >
            `ca_depend` : la personne a nommé ce facteur elle-même.
            `bascule` : sa réponse a changé quand le jeu a monté ce réglage.

    Couverture:
      type: object
      required:
        [
          part,
          pairesPertinentes,
          pairesCouvertes,
          comparaisonsRetenues,
          manifestationsRejouees,
        ]
      properties:
        part:
          type: number
          description: Part des paires pertinentes déjà confrontées (0 à 1)
        pairesPertinentes:
          type: number
          description: n(n−1)/2 restreint aux paires que les règles autorisent
        pairesCouvertes:
          type: number
        comparaisonsRetenues:
          type: number
        manifestationsRejouees:
          type: number
          description: Tensions revues sous une autre forme

    Constellation:
      type: object
      description: >
        Une carte des relations entre valeurs, à plusieurs niveaux de lecture —
        pas un palmarès. Tout est recalculable depuis les réponses brutes, et
        chaque observation transporte ses sources.
      required:
        [
          sessionId,
          version,
          ordination,
          relations,
          valeursFortes,
          valeursContextuelles,
          valeursProtegees,
          tensionsPrincipales,
          dimensionsSensibles,
          cycles,
          tendances,
          tensions,
          bascules,
          observations,
          couverture,
          stabilite,
          niveauConfianceGlobal,
          versionCalcul,
        ]
      properties:
        sessionId:
          type: string
        version:
          type: number
        ordination:
          type: array
          items:
            $ref: "#/components/schemas/LigneOrdination"
          description: Les valeurs classées par force estimée. Estimation évolutive.
        relations:
          type: array
          items:
            $ref: "#/components/schemas/RelationValeurs"
        valeursFortes:
          type: array
          items:
            type: string
          description: Valeurs prioritaires de façon régulière, dans plusieurs contextes
        valeursContextuelles:
          type: array
          items:
            $ref: "#/components/schemas/ValeurContextuelle"
        valeursProtegees:
          type: array
          items:
            type: string
          description: Valeurs pour lesquelles aucun compromis n'a encore été observé
        tensionsPrincipales:
          type: array
          items:
            $ref: "#/components/schemas/TensionPrincipale"
        dimensionsSensibles:
          type: array
          items:
            $ref: "#/components/schemas/DimensionSensible"
        cycles:
          type: array
          items:
            type: array
            items:
              type: string
          description: Boucles A > B > C > A observées. Signalées, jamais corrigées.
        tendances:
          type: array
          items:
            $ref: "#/components/schemas/TendanceValeur"
          description: Le détail chiffré, valeur par valeur
        tensions:
          type: array
          items:
            $ref: "#/components/schemas/TensionObservee"
        bascules:
          type: array
          items:
            $ref: "#/components/schemas/PointDeBascule"
        observations:
          type: array
          items:
            $ref: "#/components/schemas/ObservationConstellation"
        couverture:
          $ref: "#/components/schemas/Couverture"
        stabilite:
          type: number
          description: >
            Part des tensions revues sous une autre forme qui ont reçu la même
            réponse (0 à 1). Vaut 1 tant qu'aucune tension n'a été revue.
        niveauConfianceGlobal:
          type: string
          enum:
            [
              tendance_forte,
              tendance_probable,
              encore_incertain,
              territoire_peu_explore,
            ]
        versionCalcul:
          type: number
          description: Version du moteur de calcul utilisé

    # ─── Progression ───────────────────────────────────────────────────────────

    Progres:
      type: object
      required:
        [
          sessionId,
          etapeCourante,
          phase,
          nombreCartes,
          nombreValeurs,
          comparaisonsPlanifiees,
          comparaisonsRepondues,
          pairesPertinentes,
          pairesCouvertes,
          tensionsRestantes,
          seriesPlanifiees,
          seriesTerminees,
          nombreReponses,
          premiereOrdinationPrete,
          peutAffiner,
          prochaineQuestion,
        ]
      properties:
        sessionId:
          type: string
        etapeCourante:
          type: string
          enum:
            [
              accueil,
              selection_cartes,
              confirmation_valeurs,
              ordination,
              constellation,
              epreuve,
            ]
        phase:
          type: string
          enum: [ordination, epreuve, termine]
          description: Où en est la partie, calculé depuis les réponses
        nombreCartes:
          type: number
        nombreValeurs:
          type: number
        comparaisonsPlanifiees:
          type: number
          description: Duels prévus pour la première passe
        comparaisonsRepondues:
          type: number
        pairesPertinentes:
          type: number
          description: n(n−1)/2 restreint aux paires admissibles
        pairesCouvertes:
          type: number
        tensionsRestantes:
          type: number
          description: Tensions que la mise à l'épreuve pourrait encore poser
        seriesPlanifiees:
          type: number
        seriesTerminees:
          type: number
        nombreReponses:
          type: number
          description: Toutes réponses confondues
        premiereOrdinationPrete:
          type: boolean
          description: Vrai dès qu'il y a assez de matière pour un premier portrait
        peutAffiner:
          type: boolean
          description: Vrai s'il reste des paires jamais confrontées à compléter
        prochaineQuestion:
          oneOf:
            - $ref: "#/components/schemas/Question"
            - type: "null"
