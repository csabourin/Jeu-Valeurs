openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Jeu des valeurs — API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: catalogue
    description: Catalogue de cartes et dilemmes
  - name: sessions
    description: Sessions de jeu
  - name: cartes
    description: Cartes sélectionnées dans une session
  - name: reponses
    description: Réponses aux collisions
  - name: arbitrages
    description: Comparaisons entre les cartes de la personne
  - name: constellation
    description: Constellation personnelle

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  # ─── Catalogue ───────────────────────────────────────────────────────────────

  /catalogue/cartes:
    get:
      operationId: listCartessCatalogue
      tags: [catalogue]
      summary: Liste toutes les cartes du catalogue (filtrable par famille)
      parameters:
        - in: query
          name: famille
          required: false
          schema:
            type: string
            enum: [lignes_rouges, horizons, tresors]
      responses:
        "200":
          description: Liste de cartes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CarteCatalogue"

  /catalogue/valeurs:
    get:
      operationId: listValeursCatalogue
      tags: [catalogue]
      summary: Liste les valeurs de référence et leur description
      responses:
        "200":
          description: Liste de valeurs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ValeurCatalogue"

  # ─── Sessions ────────────────────────────────────────────────────────────────

  /sessions:
    post:
      operationId: createSession
      tags: [sessions]
      summary: Crée une nouvelle session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SessionInput"
      responses:
        "201":
          description: Session créée
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"

  /sessions/{sessionId}:
    get:
      operationId: getSession
      tags: [sessions]
      summary: Récupère une session complète
      parameters:
        - $ref: "#/components/parameters/SessionId"
      responses:
        "200":
          description: Session trouvée
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "404":
          description: Session introuvable
    patch:
      operationId: updateSession
      tags: [sessions]
      summary: Met à jour l'étape courante d'une session
      parameters:
        - $ref: "#/components/parameters/SessionId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SessionUpdate"
      responses:
        "200":
          description: Session mise à jour
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "404":
          description: Session introuvable
    delete:
      operationId: deleteSession
      tags: [sessions]
      summary: Supprime toutes les données d'une session
      parameters:
        - $ref: "#/components/parameters/SessionId"
      responses:
        "204":
          description: Session supprimée
        "404":
          description: Session introuvable

  # ─── Cartes session ──────────────────────────────────────────────────────────

  /sessions/{sessionId}/cartes-proposees:
    get:
      operationId: listCartesProposees
      tags: [cartes]
      summary: La main de cartes tirée pour cette partie
      description: >
        825 cartes ne se parcourent pas à l'écran. Chaque partie reçoit une main
        tirée avec sa graine : stable pour une partie donnée, différente d'une
        partie à l'autre.
      parameters:
        - $ref: "#/components/parameters/SessionId"
      responses:
        "200":
          description: Cartes proposées
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CarteCatalogue"
        "404":
          description: Session introuvable

  /sessions/{sessionId}/cartes:
    get:
      operationId: listCartesSession
      tags: [cartes]
      summary: Liste les cartes sélectionnées pour une session
      parameters:
        - $ref: "#/components/parameters/SessionId"
      responses:
        "200":
          description: Cartes de la session
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CarteSession"
    post:
      operationId: addCarteSession
      tags: [cartes]
      summary: Ajoute une carte (du catalogue ou personnalisée)
      parameters:
        - $ref: "#/components/parameters/SessionId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CarteSessionInput"
      responses:
        "201":
          description: Carte ajoutée
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CarteSession"
        "400":
          description: Données invalides

  /sessions/{sessionId}/cartes/{carteSessionId}:
    patch:
      operationId: updateCarteSession
      tags: [cartes]
      summary: Modifie une carte (libellé, description, valeurs confirmées)
      parameters:
        - $ref: "#/components/parameters/SessionId"
        - $ref: "#/components/parameters/CarteSessionId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CarteSessionUpdate"
      responses:
        "200":
          description: Carte mise à jour
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CarteSession"
        "404":
          description: Carte introuvable
    delete:
      operationId: removeCarteSession
      tags: [cartes]
      summary: Retire une carte de la session
      parameters:
        - $ref: "#/components/parameters/SessionId"
        - $ref: "#/components/parameters/CarteSessionId"
      responses:
        "204":
          description: Carte retirée
        "404":
          description: Carte introuvable

  # ─── Réponses (collisions) ────────────────────────────────────────────────────

  /sessions/{sessionId}/reponses:
    get:
      operationId: listReponses
      tags: [reponses]
      summary: Liste toutes les réponses aux collisions d'une session
      parameters:
        - $ref: "#/components/parameters/SessionId"
      responses:
        "200":
          description: Réponses enregistrées
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ReponseCollision"
    post:
      operationId: createReponse
      tags: [reponses]
      summary: Enregistre une réponse à une collision
      parameters:
        - $ref: "#/components/parameters/SessionId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReponseCollisionInput"
      responses:
        "201":
          description: Réponse enregistrée
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReponseCollision"
        "400":
          description: Données invalides

  /sessions/{sessionId}/reponses/{reponseId}:
    patch:
      operationId: updateReponse
      tags: [reponses]
      summary: Corrige une réponse (sans écrasement silencieux — crée une nouvelle version)
      parameters:
        - $ref: "#/components/parameters/SessionId"
        - $ref: "#/components/parameters/ReponseId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReponseCollisionUpdate"
      responses:
        "200":
          description: Réponse mise à jour
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReponseCollision"
        "404":
          description: Réponse introuvable

  # ─── Arbitrages ───────────────────────────────────────────────────────────────

  /sessions/{sessionId}/arbitrages:
    get:
      operationId: listArbitrages
      tags: [arbitrages]
      summary: Liste les blocs d'arbitrage joués dans une session
      parameters:
        - $ref: "#/components/parameters/SessionId"
      responses:
        "200":
          description: Blocs joués
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Arbitrage"
    post:
      operationId: createArbitrage
      tags: [arbitrages]
      summary: Enregistre le résultat d'un bloc d'arbitrage
      parameters:
        - $ref: "#/components/parameters/SessionId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ArbitrageInput"
      responses:
        "201":
          description: Bloc enregistré
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Arbitrage"
        "400":
          description: Données invalides

  # ─── Constellation ────────────────────────────────────────────────────────────

  /sessions/{sessionId}/constellation:
    get:
      operationId: getConstellation
      tags: [constellation]
      summary: Calcule et retourne la constellation personnelle (déterministe)
      parameters:
        - $ref: "#/components/parameters/SessionId"
      responses:
        "200":
          description: Constellation calculée
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Constellation"
        "404":
          description: Session introuvable

  /sessions/{sessionId}/progres:
    get:
      operationId: getProgres
      tags: [sessions]
      summary: Retourne un résumé de la progression de la session
      parameters:
        - $ref: "#/components/parameters/SessionId"
      responses:
        "200":
          description: Progression
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Progres"

components:
  parameters:
    SessionId:
      in: path
      name: sessionId
      required: true
      schema:
        type: string
    CarteSessionId:
      in: path
      name: carteSessionId
      required: true
      schema:
        type: number
    ReponseId:
      in: path
      name: reponseId
      required: true
      schema:
        type: number

  schemas:
    HealthStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string

    # ─── Catalogue ─────────────────────────────────────────────────────────────

    CarteCatalogue:
      type: object
      required: [id, famille, label, valeursSuggérées, origine]
      properties:
        id:
          type: string
          description: "Identifiant stable du contenu (ex. JV1001, LR042)"
        famille:
          type: string
          enum: [lignes_rouges, horizons, tresors]
        label:
          type: string
        description:
          type: ["string", "null"]
        valeursSuggérées:
          type: array
          items:
            type: string
        origine:
          type: string
          enum: [maison, relue, importee]
          description: >
            `maison` : carte écrite ici. `relue` : carte du jeu de 825, relue
            pour le registre, dont les valeurs suggérées viennent de sa
            catégorie. `importee` : pas encore relue.
        categorie:
          type: ["string", "null"]
        estPersonnalisable:
          type: boolean

    ValeurCatalogue:
      type: object
      required: [label, description, famille]
      properties:
        label:
          type: string
          description: Libellé canonique — sert d'identifiant partout
        description:
          type: string
        famille:
          type: string
          enum: [ouverture, attention_aux_autres, continuite, affirmation]

    Question:
      type: object
      description: >
        Une collision : une limite de la personne mise en face d'un enjeu —
        une aspiration qu'elle veut atteindre, ou un essentiel qu'elle veut
        préserver. `optionA` (« oui, je franchirais ») fait passer `valeurA`,
        portée par l'enjeu, devant `valeurB`, protégée par la limite.
      required:
        [
          type,
          dilemmeId,
          valeurA,
          valeurB,
          situation,
          optionA,
          optionB,
          limiteLabel,
          enjeuLabel,
          enjeuFamille,
          estReprise,
          approfondissement,
          motifs,
        ]
      properties:
        type:
          type: string
          enum: [collision]
        dilemmeId:
          type: number
        valeurA:
          type: string
          description: Valeur portée par l'enjeu — celle que « oui » fait gagner
        valeurB:
          type: string
          description: Valeur protégée par la limite — celle que « non » fait tenir
        situation:
          type: string
        optionA:
          type: string
        optionB:
          type: string
        limiteLabel:
          type: string
        enjeuLabel:
          type: string
        enjeuFamille:
          type: string
          enum: [horizons, tresors]
          description: horizons = une aspiration à obtenir, tresors = un essentiel à garder
        estReprise:
          type: boolean
          description: >
            Vrai si ce couple de valeurs a déjà été vu à travers d'autres
            cartes. C'est ainsi que se mesure la stabilité, sans jamais
            demander à la personne si elle se trouve cohérente.
        approfondissement:
          type: boolean
          description: >
            Vrai pendant la deuxième passe seulement. C'est le seul moment où
            l'on pose les questions de difficulté, de certitude et de valeur
            protégée : posées à chaque collision, elles cassent le rythme.
        motifs:
          type: array
          items:
            type: string
          description: Pourquoi le moteur a choisi cette collision. Vide en première vague.

    # ─── Session ───────────────────────────────────────────────────────────────

    Session:
      type: object
      required: [id, etapeCourante, creeLe, miseAJourLe]
      properties:
        id:
          type: string
        etapeCourante:
          type: string
          enum:
            [
              accueil,
              selection_cartes,
              confirmation_valeurs,
              arbitrages,
              collisions,
              bascules,
              constellation,
            ]
        creeLe:
          type: string
          format: date-time
        miseAJourLe:
          type: string
          format: date-time

    SessionInput:
      type: object
      properties:
        etapeCourante:
          type: string
          enum:
            [
              accueil,
              selection_cartes,
              confirmation_valeurs,
              arbitrages,
              collisions,
              bascules,
              constellation,
            ]
          default: accueil

    SessionUpdate:
      type: object
      properties:
        etapeCourante:
          type: string
          enum:
            [
              accueil,
              selection_cartes,
              confirmation_valeurs,
              arbitrages,
              collisions,
              bascules,
              constellation,
            ]

    # ─── Cartes session ────────────────────────────────────────────────────────

    CarteSession:
      type: object
      required: [id, sessionId, famille, label, valeursConfirmées, estPersonnalisée]
      properties:
        id:
          type: number
        sessionId:
          type: string
        catalogueCarteId:
          type: ["string", "null"]
        famille:
          type: string
          enum: [lignes_rouges, horizons, tresors]
        label:
          type: string
        description:
          type: ["string", "null"]
        valeursConfirmées:
          type: array
          items:
            type: string
        valeursSuggérées:
          type: array
          items:
            type: string
        estPersonnalisée:
          type: boolean
        creeLe:
          type: string
          format: date-time

    CarteSessionInput:
      type: object
      required: [famille, label]
      properties:
        catalogueCarteId:
          type: ["string", "null"]
        famille:
          type: string
          enum: [lignes_rouges, horizons, tresors]
        label:
          type: string
        description:
          type: ["string", "null"]
        valeursSuggérées:
          type: array
          items:
            type: string
        valeursConfirmées:
          type: array
          items:
            type: string
        estPersonnalisée:
          type: boolean

    CarteSessionUpdate:
      type: object
      properties:
        label:
          type: string
        description:
          type: ["string", "null"]
        valeursConfirmées:
          type: array
          items:
            type: string

    # ─── Réponses ──────────────────────────────────────────────────────────────

    ReponseCollision:
      type: object
      required: [id, sessionId, valeurA, valeurB, choix, version, creeLe]
      properties:
        id:
          type: number
        sessionId:
          type: string
        dilemmeId:
          type: ["number", "null"]
        valeurA:
          type: string
        valeurB:
          type: string
        choix:
          type: string
          enum: [A, B, ca_depend, je_ne_sais_pas, passer]
        facteurDepend:
          type: ["string", "null"]
          description: >
            Facteur prédéfini si choix=ca_depend : cout_personnel, ampleur_impact,
            proximite_sociale, nombre_personnes, certitude, reversibilite,
            urgence, responsabilite
        facteurDependLibre:
          type: ["string", "null"]
          description: Réponse libre si facteurDepend = autre
        difficulte:
          type: ["number", "null"]
          description: 1 à 5, absent si choix=passer
        certitude:
          type: ["number", "null"]
          description: 1 à 5, absent si choix=passer
        serieId:
          type: ["string", "null"]
          description: Série de bascule, si la réponse en fait partie
        palier:
          type: ["number", "null"]
        dimension:
          type: ["string", "null"]
        valeurProtegee:
          type: ["string", "null"]
          description: Valeur que la personne dit avoir voulu protéger (jamais déduite)
        version:
          type: number
          description: Numéro de version (incrémenter à chaque correction)
        creeLe:
          type: string
          format: date-time
        miseAJourLe:
          type: string
          format: date-time

    ReponseCollisionInput:
      type: object
      required: [valeurA, valeurB, choix]
      properties:
        dilemmeId:
          type: ["number", "null"]
        valeurA:
          type: string
        valeurB:
          type: string
        choix:
          type: string
          enum: [A, B, ca_depend, je_ne_sais_pas, passer]
        facteurDepend:
          type: ["string", "null"]
        facteurDependLibre:
          type: ["string", "null"]
        difficulte:
          type: ["number", "null"]
        certitude:
          type: ["number", "null"]
        serieId:
          type: ["string", "null"]
        palier:
          type: ["number", "null"]
        dimension:
          type: ["string", "null"]
        valeurProtegee:
          type: ["string", "null"]

    ReponseCollisionUpdate:
      type: object
      properties:
        choix:
          type: string
          enum: [A, B, ca_depend, je_ne_sais_pas, passer]
        facteurDepend:
          type: ["string", "null"]
        facteurDependLibre:
          type: ["string", "null"]
        difficulte:
          type: ["number", "null"]
        certitude:
          type: ["number", "null"]
        valeurProtegee:
          type: ["string", "null"]

    # ─── Arbitrages ────────────────────────────────────────────────────────────

    CarteArbitrable:
      type: object
      description: Une carte de la personne, réduite à ce qu'un bloc affiche.
      required: [id, famille, label]
      properties:
        id:
          type: string
          description: Identifiant de la carte de session, en texte
        famille:
          type: string
          enum: [lignes_rouges, horizons, tresors]
        label:
          type: string

    BlocArbitrage:
      type: object
      description: >
        Quatre cartes de la personne mises côte à côte, hors situation. On
        demande laquelle compte le plus et laquelle compte le moins.
      required: [bloc, cartes]
      properties:
        bloc:
          type: number
          description: Rang du bloc dans la partie, à partir de 1
        cartes:
          type: array
          items:
            $ref: "#/components/schemas/CarteArbitrable"

    Arbitrage:
      type: object
      required: [id, sessionId, bloc, carteIds, version, creeLe]
      properties:
        id:
          type: number
        sessionId:
          type: string
        bloc:
          type: number
        carteIds:
          type: array
          items:
            type: string
          description: >
            Composition du bloc au moment où il a été joué. Figée : une carte
            retirée ensuite ne doit pas rendre la réponse illisible.
        carteMeilleure:
          type: ["string", "null"]
          description: Null avec cartePire quand le bloc a été passé
        cartePire:
          type: ["string", "null"]
        version:
          type: number
        creeLe:
          type: string
          format: date-time
        miseAJourLe:
          type: string
          format: date-time

    ArbitrageInput:
      type: object
      required: [bloc, carteIds]
      properties:
        bloc:
          type: number
        carteIds:
          type: array
          items:
            type: string
        carteMeilleure:
          type: ["string", "null"]
        cartePire:
          type: ["string", "null"]

    ScoreCarte:
      type: object
      description: La place d'une carte dans le classement déclaré de la personne.
      required:
        [carteId, label, famille, apparitions, foisMeilleure, foisPire, score]
      properties:
        carteId:
          type: string
        label:
          type: string
        famille:
          type: string
          enum: [lignes_rouges, horizons, tresors]
        apparitions:
          type: number
          description: Nombre de blocs où la carte a été proposée
        foisMeilleure:
          type: number
        foisPire:
          type: number
        score:
          type: number
          description: (meilleure − pire) / apparitions, dans [-1, 1]

    ValeurDeclaree:
      type: object
      description: >
        Score moyen des cartes portant cette valeur. Hypothèse, pas mesure : la
        personne a classé des cartes, pas des valeurs. Ne sert qu'à repérer un
        écart franc avec ce qui s'est joué en situation.
      required: [valeur, scoreDeclare, cartes]
      properties:
        valeur:
          type: string
        scoreDeclare:
          type: number
        cartes:
          type: array
          items:
            type: string
          description: Libellés des cartes qui portent cette valeur

    # ─── Constellation ─────────────────────────────────────────────────────────

    TendanceValeur:
      type: object
      description: >
        Une valeur telle que la partie l'a située. La force et le rang viennent
        de l'ordination Bradley–Terry ; le reste dit sur quoi elle repose.
      required:
        [
          valeur,
          force,
          rang,
          totalCollisions,
          foisPrivilegiee,
          foisCedee,
          incertitudes,
          difficulteMoyenne,
          certitudeMoyenne,
          territoireInexplore,
        ]
      properties:
        valeur:
          type: string
        force:
          type: number
          description: Force Bradley–Terry, normalisée autour de 1
        rang:
          type: number
          description: Rang à partir de 1. Les ex æquo partagent le rang.
        totalCollisions:
          type: number
        foisPrivilegiee:
          type: number
          description: Fois où cette valeur est passée devant l'autre
        foisCedee:
          type: number
          description: Fois où cette valeur a cédé la place
        incertitudes:
          type: number
          description: ca_depend + je_ne_sais_pas
        difficulteMoyenne:
          type: ["number", "null"]
          description: >
            Recueillie seulement pendant l'approfondissement : souvent nulle
            après la première passe, et ce n'est pas une anomalie.
        certitudeMoyenne:
          type: ["number", "null"]
        territoireInexplore:
          type: boolean
          description: Vrai si aucune collision résolue pour cette valeur

    TensionObservee:
      type: object
      required: [valeurA, valeurB, totalCollisions, incertitudes, estForte, estStable]
      properties:
        valeurA:
          type: string
        valeurB:
          type: string
        totalCollisions:
          type: number
        incertitudes:
          type: number
        estForte:
          type: boolean
          description: La personne a rarement tranché cette tension
        estStable:
          type: ["boolean", "null"]
          description: >
            Null si la tension n'a été rencontrée qu'une fois. Sinon, vrai si la
            même tension a reçu la même réponse sous ses différentes formes.

    PointDeBascule:
      type: object
      description: >
        Jusqu'où une limite tient, et à partir de quel enjeu elle devient
        franchissable. La question posée est : quelle importance doit avoir
        l'enjeu pour que cette limite cède ?
      required:
        [
          limiteId,
          limiteLabel,
          tientDevant,
          cedeDevant,
          jamaisFranchie,
          toujoursFranchie,
          ordreInverse,
        ]
      properties:
        limiteId:
          type: string
        limiteLabel:
          type: string
        tientDevant:
          type: ["string", "null"]
          description: L'enjeu le plus lourd devant lequel la limite a tenu
        cedeDevant:
          type: ["string", "null"]
          description: L'enjeu le plus léger devant lequel la limite a cédé
        jamaisFranchie:
          type: boolean
        toujoursFranchie:
          type: boolean
        ordreInverse:
          type: boolean
          description: >
            La limite a cédé devant un enjeu plus léger que celui devant lequel
            elle a tenu. Ce n'est pas une incohérence à corriger : c'est le
            signe que le contexte, et non le poids de l'enjeu, a fait la
            différence.

    RangValeur:
      type: object
      description: >
        Une valeur dans l'ordination. La force vient d'un modèle de
        Bradley–Terry sur les collisions jouées : battre une valeur qui gagne
        souvent pèse plus que battre une valeur qui perd partout. Le classement
        n'est jamais demandé à la personne, il émerge de ses arbitrages.
      required:
        [valeur, force, rang, confrontations, gagnees, perdues, indecises]
      properties:
        valeur:
          type: string
        force:
          type: number
          description: Force Bradley–Terry, normalisée autour de 1
        rang:
          type: number
          description: Rang à partir de 1. Les ex æquo partagent le rang.
        confrontations:
          type: number
        gagnees:
          type: number
        perdues:
          type: number
        indecises:
          type: number

    ObservationConstellation:
      type: object
      required:
        [id, texte, type, valeursConcernees, reponsesSources, arbitragesSources]
      properties:
        id:
          type: string
        texte:
          type: string
          description: Formulation prudente (ex. "Dans les situations explorées jusqu'ici…")
        type:
          type: string
          enum:
            [
              tendance,
              tension,
              territoire_inexplore,
              stabilite,
              couverture,
              point_de_bascule,
              limite_tenue,
              arbitrage,
              ecart_declare,
            ]
        valeursConcernees:
          type: array
          items:
            type: string
        reponsesSources:
          type: array
          items:
            type: number
          description: IDs dans `reponses_collision` qui appuient cette observation
        arbitragesSources:
          type: array
          items:
            type: number
          description: >
            IDs dans `arbitrages`. Séparés des précédents : les deux tables ont
            des identifiants qui se recouvrent, et « D'où ça sort ? »
            afficherait un bloc à la place d'une situation.

    Constellation:
      type: object
      required:
        [
          sessionId,
          version,
          tendances,
          tensions,
          bascules,
          cartesJugees,
          valeursDeclarees,
          observations,
          couverture,
          stabilite,
          versionCalcul,
        ]
      properties:
        sessionId:
          type: string
        version:
          type: number
        tendances:
          type: array
          items:
            $ref: "#/components/schemas/TendanceValeur"
        tensions:
          type: array
          items:
            $ref: "#/components/schemas/TensionObservee"
        bascules:
          type: array
          items:
            $ref: "#/components/schemas/PointDeBascule"
        cartesJugees:
          type: array
          items:
            $ref: "#/components/schemas/ScoreCarte"
          description: Classement déclaré des cartes. Vide si la phase n'a pas été jouée.
        valeursDeclarees:
          type: array
          items:
            $ref: "#/components/schemas/ValeurDeclaree"
        observations:
          type: array
          items:
            $ref: "#/components/schemas/ObservationConstellation"
        couverture:
          type: number
          description: Proportion de collisions possibles explorées (0 à 1)
        stabilite:
          type: number
          description: >
            Part des tensions revues sous une autre forme qui ont reçu la même
            réponse (0 à 1). Vaut 1 tant qu'aucune tension n'a été revue.
        versionCalcul:
          type: number
          description: Version du moteur de calcul utilisé

    # ─── Progression ───────────────────────────────────────────────────────────

    Progres:
      type: object
      required:
        [
          sessionId,
          etapeCourante,
          phase,
          nombreCartes,
          nombreValeurs,
          arbitragesPlanifies,
          arbitragesRepondus,
          duelsPlanifies,
          duelsRepondus,
          collisionsPossibles,
          collisionsRepondues,
          classement,
          nombreReponses,
          prochaineQuestion,
          prochainBloc,
        ]
      properties:
        sessionId:
          type: string
        etapeCourante:
          type: string
          enum:
            [
              accueil,
              selection_cartes,
              confirmation_valeurs,
              arbitrages,
              collisions,
              bascules,
              constellation,
            ]
        phase:
          type: string
          enum: [arbitrages, duels, portrait, bascules, termine]
          description: >
            Où en est la partie, calculé depuis les réponses. `duels` est la
            première vague de collisions ; `portrait` est la porte où la
            personne voit son ordination et décide de la mettre à l'épreuve ;
            `bascules` est l'approfondissement.
        nombreCartes:
          type: number
        nombreValeurs:
          type: number
        arbitragesPlanifies:
          type: number
          description: Nombre de blocs d'arbitrage prévus pour cette partie
        arbitragesRepondus:
          type: number
        duelsPlanifies:
          type: number
          description: >
            Taille de la première vague — ce qu'il faut jouer pour voir le
            portrait. Un exemplaire de chaque couple de valeurs.
        duelsRepondus:
          type: number
        collisionsPossibles:
          type: number
          description: >
            Toutes les collisions admissibles entre les cartes de la personne.
            Le jeu n'impose aucun plafond : il les sert par vagues.
        collisionsRepondues:
          type: number
        classement:
          type: array
          items:
            $ref: "#/components/schemas/RangValeur"
          description: >
            L'ordination telle qu'elle se présente. Vide tant que la première
            vague n'est pas terminée : le portrait n'existe pas encore.
        nombreReponses:
          type: number
          description: Toutes réponses confondues
        prochaineQuestion:
          oneOf:
            - $ref: "#/components/schemas/Question"
            - type: "null"
        prochainBloc:
          description: >
            Servi seulement pendant la phase d'arbitrage. Un bloc n'est pas une
            Question : il ne pose pas de situation et n'oppose pas deux valeurs.
          oneOf:
            - $ref: "#/components/schemas/BlocArbitrage"
            - type: "null"
